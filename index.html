<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="color-scheme" content="light dark">
<title>2nul's script repository</title>

<style type="text/css">
body {
  color: #1B1F23;
  background: #F6F8FA;
  font-size: 14px;
  font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  line-height: 1.5;
  max-width: 620px;
  margin: 28px auto;
  text-align: center;
}

h2 {
  font-size: 20px;
  margin-bottom: 0;
}

p {
  margin-top: 0;
}

.icons {
  display: flex;
  justify-content: center;
  align-items: center;
}

nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 20px 28px 0;
}

nav a {
  color: #1B1F23;
  text-decoration: none;
  padding: 8px 14px;
  border: 1px solid #E1E4E8;
  border-radius: 6px;
  background: white;
  transition: background 0.15s, border-color 0.15s;
}

nav a:hover {
  background: #F0F2F4;
  border-color: #D0D7DE;
}

.box {
  border: 1px solid #E1E4E8;
  background: white;
  padding: 24px;
  margin: 28px;
}

@media (prefers-color-scheme: dark) {
  body {
    color: #C9D1D9;
    background: #0D1117;
  }

  nav a {
    color: #C9D1D9;
    border-color: #30363D;
    background: #161B22;
  }

  nav a:hover {
    background: #21262D;
    border-color: #484F58;
  }

  .box {
    border-color: #30363D;
    background: #161B22;
  }
}
</style>
</head>

<body>

    <div class="icons">
        <img src="https://avatars.githubusercontent.com/u/322348305?v=4"
             style="width: 28%; height: auto;" />
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/scripts.html">Scripts</a>
    </nav>

    <div class="box">
        <h2>This is 2nul's script repository</h2>
        <span>There is nothing here!</span>
    </div>

</body>
</html>
